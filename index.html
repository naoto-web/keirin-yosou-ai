<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>競輪予想AI</title>
  <meta name="theme-color" content="#e9e7e1">
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- 読み込み係（2026-10-20・Naoto「更新しても新しい表示に変わらない」）＝GitHub Pages は全ファイルに max-age=600 を付けるので、
       固定の ?v=15 だと公開後も最大10分は古いJSが使われる。version.json（no-store）の番号を ?v= に付けてCSS/JSを読めば公開直後から新しい版になる。
       この index.html 自体は10分古くてよい＝ここは極力変えない（楽屋アプリ oretachi-keirin と同じ作法） -->
  <script>
    (async function () {
      let v = 'x';
      try { const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); v = (await r.json()).v || v; } catch (e) {}
      try { localStorage.setItem('kai_ver', JSON.stringify(v)); } catch (e) {}   // app.js の版チェックと同じ鍵＝読み直しのループを作らない
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'css/app.css?v=' + v; document.head.appendChild(css);
      for (const f of ['util', 'api', 'setup', 'home', 'race', 'stats', 'kensho', 'app']) {
        await new Promise(res => { const s = document.createElement('script'); s.src = 'js/' + f + '.js?v=' + v; s.onload = res; s.onerror = res; (document.body || document.documentElement).appendChild(s); });
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">競輪予想AI</a>
    <span class="topbar-sub" id="topbar-sub"></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar">
    <a href="#/" data-tab="today"><span class="ic">📅</span>今日</a>
    <a href="#/stats" data-tab="stats"><span class="ic">📈</span>成績</a>
    <a href="#/kensho" data-tab="kensho"><span class="ic">🔬</span>検証</a>
  </nav>
  <!-- CSS/JS は上の読み込み係が version.json の番号つきで足す（固定の ?v= はやめた） -->
</body>
</html>
